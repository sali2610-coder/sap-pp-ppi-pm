name: CI

# Phase 8 quality gates: typecheck, lint (0 errors), production build,
# manifest-drift guard (M1), and dead-link crawl (M2). Runs on every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Vercel config must be valid
        # Runs before the slow steps: an invalid vercel.json is rejected by the
        # platform before a build even starts, so there is no point spending
        # four minutes on tsc and a static export first.
        run: npm run check:vercel

      - name: Unit tests
        # Fast and dependency-free (node:test). Runs before the build because a
        # broken parser should fail in seconds, not after a 4,600-page export.
        run: npm test

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: TypeScript (tests)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: ESLint (fail on errors)
        run: npx eslint . --ext .ts,.tsx

      - name: Production build (static export)
        run: npm run build

      - name: M1 — route-manifest drift guard
        run: npm run check:routes

      - name: Diagnostics page must ship with every build
        run: npm run check:diag

      - name: Sitemap must cover every indexable page
        run: npm run check:sitemap

      - name: M2 — dead-link crawl
        run: npm run crawl:deadlinks
