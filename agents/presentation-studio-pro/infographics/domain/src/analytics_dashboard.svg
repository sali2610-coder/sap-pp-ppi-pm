  <polyline points="80,560 200,540 320,520 440,535 560,500 700,470" fill="none" stroke="#14B8A6" stroke-width="4"/>
  <rect x="824" y="230" width="408" height="430" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="848" y="266" font-size="15" fill="#94A3B8">Mix</text>
  <circle cx="1028" cy="460" r="120" fill="none" stroke="#1E293B" stroke-width="40"/>
  <circle cx="1028" cy="460" r="120" fill="none" stroke="#38BDF8" stroke-width="40" stroke-dasharray="450 754" transform="rotate(-90 1028 460)"/>
</svg>
