<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
 <rect width="640" height="420" fill="#ffffff"/>
 <circle cx="320" cy="205" r="172" fill="#ECECEC"/>
 <!-- clouds -->
 <g fill="#E0E0E0">
  <ellipse cx="180" cy="120" rx="46" ry="17"/><ellipse cx="215" cy="110" rx="30" ry="14"/>
  <ellipse cx="470" cy="135" rx="40" ry="15"/><ellipse cx="500" cy="127" rx="26" ry="12"/>
 </g>
 <!-- road -->
 <g stroke="#2A2A2A" stroke-width="2.6" stroke-linecap="round">
  <line x1="90" y1="340" x2="560" y2="318"/>
 </g>
 <g stroke="#9A9A9A" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 20">
  <line x1="110" y1="356" x2="545" y2="334"/>
 </g>
 <!-- truck body group -->
 <g stroke="#1D1D1D" stroke-width="3.4" stroke-linejoin="round" fill="#ffffff">
  <!-- cargo box (right) -->
  <rect x="300" y="150" width="168" height="150" rx="8"/>
  <!-- cab (left) -->
  <path d="M300 300 V206 H214 c-10 0-18 7-21 16 l-22 60 c-2 6-1 12-1 18 v0 z"/>
  <!-- cab roof curve -->
  <path d="M300 206 H214 c-10 0-18 7-21 16 l-10 28" fill="none"/>
  <!-- windshield -->
  <path d="M226 224 h54 c5 0 8 3 8 8 v34 h-78 z" fill="#DCEAF5" stroke="#1D1D1D" stroke-width="3"/>
  <!-- bumper / headlight -->
  <rect x="166" y="286" width="20" height="16" rx="4" fill="#E1121D" stroke="#1D1D1D" stroke-width="2.4"/>
 </g>
 <!-- heart on box -->
 <g transform="translate(330,178) scale(1.08)">
  <path d="M54 92 C24 70 4 53 4 32 C4 14 25 8 38 21 C46 28 53 40 54 49 C55 40 62 28 70 21 C83 8 104 14 104 32 C104 53 84 70 54 92 Z" fill="#E1121D"/>
  <g stroke="#fff" stroke-width="3.8" fill="none" stroke-linecap="round">
   <path d="M54 86 C50 65 41 52 29 43"/><path d="M54 84 C58 63 67 50 79 43"/>
   <path d="M54 82 C48 65 34 58 22 56"/><path d="M54 80 C60 63 74 58 86 56"/>
  </g>
 </g>
 <!-- wheels -->
 <g>
  <circle cx="250" cy="300" r="30" fill="#1D1D1D"/><circle cx="250" cy="300" r="13" fill="#fff"/><circle cx="250" cy="300" r="4" fill="#E1121D"/>
  <circle cx="408" cy="300" r="30" fill="#1D1D1D"/><circle cx="408" cy="300" r="13" fill="#fff"/><circle cx="408" cy="300" r="4" fill="#E1121D"/>
 </g>
</svg>
