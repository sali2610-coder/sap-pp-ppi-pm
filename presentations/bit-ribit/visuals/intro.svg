" cy="540" r="22" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(1022.0,530.0) scale(0.8333)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z M12 11.4a.6.6 0 1 0 0 1.2.6.6 0 0 0 0-1.2Z"/></g><text x="1188" y="592" font-size="16" fill="#0A2540" font-weight="bold" text-anchor="start">OKR / SMART</text><rect x="1118" y="608" width="70" height="24" rx="12" fill="#F5F8FB" stroke="none" stroke-width="1"/><text x="1153" y="624" font-size="12.5" fill="#7C8895" font-weight="normal" text-anchor="middle">מדידה</text><text x="1210" y="672" font-size="14" fill="#7C8895" font-weight="normal" text-anchor="start" opacity="1">כל חמש המסגרות מהמטלה נשמרות במלואן ומשודרגות בשקפים הבאים.</text></svg>