<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Arial Hebrew', 'Helvetica Neue', sans-serif" direction="rtl"><rect width="1280" height="720" fill="#FFFFFF"/><defs>
