</defs><rect x="40" y="38" width="168" height="34" rx="9" fill="#FFFFFF" stroke="#16B6CE" stroke-width="1.4"/><text x="124" y="60" font-size="14" fill="#0E7C9B" font-weight="bold" text-anchor="middle">מבוא</text><text x="1240" y="52" font-size="13" fill="#0E7C9B" font-weight="bold" text-anchor="end" direction="ltr" unicode-bidi="isolate" letter-spacing="2.6">APPROACH · METHODOLOGY</text><text x="1240" y="93" font-size="32" fill="#07203A" font-weight="bold" text-anchor="start">מבוא ומתודולוגיה</text><line x1="40" y1="112" x2="1240" y2="112" stroke="#E4EAF0" stroke-width="1.5"/><rect x="1070" y="109" width="170" height="4" rx="2" fill="url(#gCyan)" stroke="none" stroke-width="1"/><rect x="70" y="146" width="1140" height="92" rx="16" fill="#FFFFFF" stroke="#E4EAF0" stroke-width="1.2" filter="url(#shS)"/><rect x="70" y="146" width="7" height="92" rx="4" fill="#16B6CE" stroke="none" stroke-width="1"/><circle cx="1180" cy="192" r="28" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(1167.0,179.0) scale(1.0833)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 21 9l-9 5-9-5Z M3 14l9 5 9-5"/></g><text x="1130" y="184" font-size="19" fill="#0A2540" font-weight="bold" text-anchor="start">כיוון הצמיחה</text><text x="1130" y="214" font-size="15" fill="#22303C" font-weight="normal" text-anchor="start">מעבר מאפליקציית העברות (P2P) לפלטפורמה פיננסית — דרך ”ריביט”, פיקדון נושא ריבית (נובמבר 2025): 4% שנתי, 10–20,000 ₪, מסלול נזיל/נעול.</text><rect x="70" y="250" width="1140" height="92" rx="16" fill="#FFFFFF" stroke="#E4EAF0" stroke-width="1.2" filter="url(#shS)"/><rect x="70" y="250" width="7" height="92" rx="4" fill="#16B6CE" stroke="none" stroke-width="1"/><circle cx="1180" cy="296" r="28" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(1167.0,283.0) scale(1.0833)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 3.5 3.5L20 7 M15 7h5v5"/></g><text x="1130" y="288" font-size="19" fill="#0A2540" font-weight="bold" text-anchor="start">סוג השינוי</text><text x="1130" y="318" font-size="15" fill="#22303C" font-weight="normal" text-anchor="start">עיבוי יכולות (Product Intensification) ואסטרטגיית me-too — מינוף 3.5 מיליון משתמשים ו~29.4 מיליארד ₪ העברות בשנה.</text><rect x="70" y="354" width="1140" height="92" rx="16" fill="#FFFFFF" stroke="#E4EAF0" stroke-width="1.2" filter="url(#shS)"/><rect x="70" y="354" width="7" height="92" rx="4" fill="#16B6CE" stroke="none" stroke-width="1"/><circle cx="1180" cy="400" r="28" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(1167.0,387.0) scale(1.0833)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z M12 11.4a.6.6 0 1 0 0 1.2.6.6 0 0 0 0-1.2Z"/></g><text x="1130" y="392" font-size="19" fill="#0A2540" font-weight="bold" text-anchor="start">המתודולוגיה</text><text x="1130" y="422" font-size="15" fill="#22303C" font-weight="normal" text-anchor="start">חמש מסגרות ניתוח שנלמדו בקורס, המכסות שלושה צירים: שוק · תחרות · לקוח (ומדידה).</text><text x="1210" y="484" font-size="15" fill="#7C8895" font-weight="bold" text-anchor="start">חמש המסגרות — לפי ציר</text><rect x="70" y="502" width="212" height="140" rx="16" fill="#FFFFFF" stroke="#E4EAF0" stroke-width="1.2" filter="url(#shS)"/><rect x="70" y="502" width="212" height="6" rx="6" fill="#0A2540" stroke="none" stroke-width="1"/><text x="260" y="556" font-size="30" fill="#0A2540" font-weight="bold" text-anchor="start" direction="ltr" unicode-bidi="isolate" font-family="'Arial Black', Arial, sans-serif">1</text><circle cx="104" cy="540" r="22" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(94.0,530.0) scale(0.8333)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2