1155.0,357.0) scale(0.9167)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2 21 19.5H3Z M12 10v4.2 M12 16.8h.01"/></g><text x="1126" y="358" font-size="16.5" fill="#0A2540" font-weight="bold" text-anchor="start">כאבים (Pains)</text><text x="1126" y="384" font-size="13.5" fill="#22303C" font-weight="normal" text-anchor="start">כסף בעו"ש/ביט כמעט ללא ריבית בזמן</text><text x="1126" y="405" font-size="13.5" fill="#22303C" font-weight="normal" text-anchor="start">שמתחרים מפרסמים 2.5%–6% — "פספוס תשואה"</text><circle cx="1166" cy="486" r="24" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(1155.0,475.0) scale(0.9167)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5h8v3.5a4 4 0 0 1-8 0Z M8 6.2H5.2v.9a3 3 0 0 0 3 3 M16 6.2h2.8v.9a3 3 0 0 1-3 3 M10 13.8h4 M9 19.5h6 M12 13.8v3.4"/></g><text x="1126" y="476" font-size="16.5" fill="#0A2540" font-weight="bold" text-anchor="start">רווחים רצויים (Gains)</text><text x="1126" y="502" font-size="13.5" fill="#22303C" font-weight="normal" text-anchor="start">תשואה פשוטה בקליק · שקיפות · גב בנקאי אמין</text><rect x="70" y="148" width="512" height="452" rx="18" fill="#FFFFFF" stroke="#E4EAF0" stroke-width="1.2" filter="url(#shS)"/><rect x="70" y="148" width="512" height="56" rx="18" fill="url(#gNavy)" stroke="none" stroke-width="1"/><rect x="70" y="186" width="512" height="18" rx="0" fill="url(#gNavy)" stroke="none" stroke-width="1"/><text x="556" y="184" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start">מפת הערך (Bit / ריביט)</text><circle cx="538" cy="250" r="24" fill="#E7F8FB" stroke="none" stroke-width="1"/><g transform="translate(527.0,239.0) scale(0.9167)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5C3 7 4 6 5.5 6H17l1.5 0 M3 8.5V17a2 2 0 0 0 2 2h13a1.5 1.5 0 0 0 1.5-1.5V11A1.5 1.5 0 0 0 18 9.5H5.5A2