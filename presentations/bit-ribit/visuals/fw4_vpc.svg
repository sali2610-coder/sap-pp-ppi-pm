idth="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L20 6.5"/></g><path d="M698 300 L644 300" stroke="#0E7C9B" stroke-width="7" marker-end="url(#fa)"/><path d="M582 300 L528 300" stroke="#0E7C9B" stroke-width="7" marker-end="url(#fa)"/><defs><marker id="fa" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0E7C9B"/></marker></defs><text x="626" y="378" font-size="14" fill="#0E7C9B" font-weight="bold" text-anchor="middle" direction="ltr" unicode-bidi="isolate" letter-spacing="3">FIT</text><rect x="70" y="620" width="1140" height="56" rx="14" fill="#E7F8FB" stroke="#16B6CE" stroke-width="1"/><g transform="translate(90,636) scale(1.0000)" fill="none" stroke="#0E7C9B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L20 6.5"/></g><text x="1188" y="648" font-size="14.5" fill="#0E7C9B" font-weight="bold" text-anchor="start">Fit:</text><text x="1148" y="648" font-size="13.5" fill="#22303C" font-weight="normal" text-anchor="start">ריביט ממנף משתמשים מזוהים (KYC) ומסיר חיכוך — יתרון תחרותי מובהק על הבנקים, לא רק התשואה.</text><text x="1240" y="702" font-size="12.5" fill="#AEB8C2" font-weight="normal" text-anchor="start">עיבוד המגישים לפי Osterwalder VPC</text></svg>