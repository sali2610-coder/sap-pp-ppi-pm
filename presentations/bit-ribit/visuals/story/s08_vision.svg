</defs><text x="1240" y="58" font-size="13" fill="#2DD8EC" font-weight="bold" text-anchor="end" direction="ltr" unicode-bidi="isolate" letter-spacing="2.6">VISION & MISSION</text><rect x="1232" y="74" width="8" height="40" rx="3" fill="url(#gcyV)"/><text x="1216" y="107" font-size="33" fill="#F4F8FC" font-weight="bold" text-anchor="start">מהחזון של הבנק — אל הביצוע של ריביט.</text><rect x="70" y="168" width="540" height="406" rx="20" fill="#18242F" stroke="#2C3B48" stroke-width="1" filter="url(#sh)"/><rect x="70" y="168" width="540" height="6" rx="3" fill="#8696A4" stroke="none" stroke-width="1"/><circle cx="120" cy="216" r="24" fill="#173745" stroke="none" stroke-width="1"/><g transform="translate(109.0,205.0) scale(0.9167)" fill="none" stroke="#B8C7D4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z M3 12h18 M12 3c2.5 2.6 2.5 15.4 0 18 M12 3c-2.5 2.6-2.5 15.4 0 18"/></g><text x="580" y="222" font-size="15" fill="#8696A4" font-weight="bold" text-anchor="start" letter-spacing="1">החזון</text><text x="580" y="288" font-size="30" fill="#F4F8FC" font-weight="normal" text-anchor="start">”מחויבים לצמיחה</text><text x="580" y="326" font-size="30" fill="#F4F8FC" font-weight="normal" text-anchor="start">באמצעות בנקאות</text><text x="580" y="364" font-size="30" fill="#2DD8EC" font-weight="bold" text-anchor="start">מתחדשת והוגנת</text><text x="580" y="402" font-size="30" fill="#F4F8FC" font-weight="normal" text-anchor="start">ללקוחותינו.”</text><text x="580" y="458" font-size="13" fill="#8696A4" font-weight="normal" text-anchor="start">בנק הפועלים · חזון הבנק</text><rect x="680" y="168" width="530" height="406" rx="20" fill="url(#gnavy)" stroke="#2DD8EC" stroke-width="1.6" filter="url(#sh)"/><rect x="680" y="168" width="530" height="6" rx="3" fill="#2DD8EC" stroke="none" stroke-width="1"/><circle cx="720" cy="216" r="24" fill="#164255" stroke="none" stroke-width="1" filter="url(#glowS)"/><g transform="translate(7