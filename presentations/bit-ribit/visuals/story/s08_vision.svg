e">מבצע</text><text x="640" y="612" font-size="17" fill="#B8C7D4" font-weight="normal" text-anchor="middle">ריביט מתרגם עיקרון מהחזון — לשירות פיננסי יומיומי בכיס.</text><text x="40" y="702" font-size="12" fill="#8696A4" font-weight="normal" text-anchor="start">ביט (bit) · ריביט — עבודת סיום</text><text x="1240" y="702" font-size="12" fill="#8696A4" font-weight="normal" text-anchor="start" direction="ltr" unicode-bidi="isolate">8 / 15</text></svg>